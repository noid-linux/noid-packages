name: Check build

on:
  pull_request:
    paths:
      - "srcpkgs/**"
      - "common/repos/**"
  push:
    branches:
      - "ci-**"
    paths:
      - "srcpkgs/**"
      - "common/repos/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint changed templates.
  xlint:
    name: Lint templates
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/void-linux/void-musl-full
      env:
        LICENSE_LIST: common/travis/license.lst

    steps:
      - name: Prepare container
        run: |
          # switch to repo-ci mirror
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          # install dependencies
          xbps-install -Syu xbps && xbps-install -yu &&
          xbps-install -y sudo bash grep curl git fd
          # ensure bash is available
          if ! bash -c true; then
            echo "::error title=Failed to set up build environment::Bash was not found. Re-run this job."
            exit 1
          fi
          # create non-root user
          useradd -G xbuilder -M builder

      - name: Clone and checkout
        uses: ndpm13/treeless-checkout-action@v1
        with:
          ref: "refs/heads/master"
          repository: "void-linux/void-packages"
          directory: "void-packages"

      - name: Clone and checkout
        uses: ndpm13/treeless-checkout-action@v1
        with:
          directory: "noid-packages"

      - name: Apply Noid overlay
        run: |
          cd noid-packages
          common/natalie/apply_overlay.sh

      - name: Prepare Void masterdir
        run: |
          cd void-packages
          chown -R builder:builder . &&
          sudo -Eu builder common/travis/set_mirror.sh &&
          common/travis/fetch-xtools.sh

      - name: Prepare Noid masterdir
        run: |
          cd noid-packages
          chown -R builder:builder .

      - name: Find changed templates
        run: |
          cd noid-packages
          sudo -Eu builder common/natalie/changed_templates.sh

      - name: Run lints
        run: |
          cd void-packages
          sudo -Eu builder common/travis/verify-update-check.sh || rv=1
          sudo -Eu builder common/travis/xlint.sh || rv=1
          exit "${rv:-0}"

  # Build changed packages.
  build:
    name: Build packages
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, '[ci skip]') && !contains(github.event.pull_request.body, '[ci skip]')"

    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --platform linux/amd64 --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: "x86_64"
        BOOTSTRAP: "x86_64"
        TEST: 1

    steps:
      - name: Prepare container
        run: |
          # switch to repo-ci mirror
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          # install dependencies
          xbps-install -Syu xbps && xbps-install -yu &&
          xbps-install -y sudo bash curl git fd
          # ensure bash is available
          if ! bash -c true; then
            echo "::error title=Failed to set up build environment::Bash was not found. Re-run this job."
            exit 1
          fi
          # create non-root user
          useradd -G xbuilder -M builder

      - name: Clone and checkout
        uses: ndpm13/treeless-checkout-action@v1
        with:
          ref: "refs/heads/master"
          repository: "void-linux/void-packages"
          directory: "void-packages"

      - name: Clone and checkout
        uses: ndpm13/treeless-checkout-action@v1
        with:
          directory: "noid-packages"

      - name: Apply Noid overlay
        run: |
          cd noid-packages
          common/natalie/apply_overlay.sh

      - name: Prepare Void masterdir
        run: |
          cd void-packages
          chown -R builder:builder . &&
          sudo -Eu builder common/travis/set_mirror.sh &&
          sudo -Eu builder common/travis/prepare.sh &&
          common/travis/fetch-xtools.sh

      - name: Prepare Noid masterdir
        run: |
          cd noid-packages
          chown -R builder:builder .

      - name: Find changed templates
        run: |
          cd noid-packages
          sudo -Eu builder common/natalie/changed_templates.sh

      - name: Build and check packages
        run: |
          cd void-packages
          sudo -Eu builder common/travis/build.sh "$BOOTSTRAP" "$ARCH" "$TEST"

      - name: Show files
        run: |
          cd void-packages
          sudo -Eu builder common/natalie/show_files.sh "$BOOTSTRAP" "$ARCH"

      - name: Compare to previous
        run: |
          cd void-packages
          sudo -Eu builder common/travis/xpkgdiff.sh "$BOOTSTRAP" "$ARCH"

      - name: Check file conflicts
        run: |
          if [ -s /tmp/templates ]; then
              cd void-packages
              export XDG_CACHE_HOME="$PWD/.cache"
              sudo -Eu builder xlocate -S &&
              sudo -Eu builder common/natalie/lint-conflicts
          fi

      - name: Verify repository state
        run: |
          cd void-packages
          mkdir -p /check-install &&
          chown builder:builder /check-install &&
          sudo -Eu builder common/natalie/check-install.sh "$BOOTSTRAP" "$ARCH"
