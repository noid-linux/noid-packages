name: Publish packages

on:
  push:
    branches:
      - "master"
    paths:
      - "srcpkgs/**"
      - "common/repos/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Build changed packages.
  build:
    name: Publish packages
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, '[ci skip]') && !contains(github.event.pull_request.body, '[ci skip]')"

    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --platform linux/amd64 --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: "x86_64"
        BOOTSTRAP: "x86_64"
        BASEURL: "${{ github.server_url }}/${{ github.repository }}/releases/download"

    steps:
      - name: Prepare container
        run: |
          # switch to repo-ci mirror
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          # install dependencies
          xbps-install -Syu xbps && xbps-install -yu &&
          xbps-install -y sudo bash curl git ripgrep github-cli
          # ensure bash is available
          if ! bash -c true; then
            echo "::error title=Failed to set up build environment::Bash was not found. Re-run this job."
            exit 1
          fi
          # create non-root user
          useradd -G xbuilder -M builder

      - name: Clone and checkout
        uses: ndpm13/treeless-checkout-action@v1
        with:
          ref: "refs/heads/master"
          repository: "void-linux/void-packages"
          directory: "void-packages"

      - name: Clone and checkout
        uses: ndpm13/treeless-checkout-action@v1
        with:
          directory: "noid-packages"

      - name: Apply Noid overlay
        run: |
          cp -r noid-packages/etc/* void-packages/etc/
          cp -r --remove-destination noid-packages/srcpkgs/* void-packages/srcpkgs/
          cp noid-packages/common/repo-keys/* void-packages/common/repo-keys/
          # patch < noid-packages/common/shlibs.diff -Np1 void-packages/common/shlibs
          sed -i "1i repository=$BASEURL/main" void-packages/etc/xbps.d/repos-remote.conf

      - name: Prepare Void masterdir
        run: |
          cd void-packages
          chown -R builder:builder . &&
          sudo -Eu builder common/travis/set_mirror.sh &&
          sudo -Eu builder common/travis/prepare.sh &&
          common/travis/fetch-xtools.sh

      - name: Prepare Noid masterdir
        run: |
          cd noid-packages
          chown -R builder:builder .

      - name: Find outdated packages
        run: |
          cd noid-packages
          sudo -Eu builder common/natalie/outdated_packages.sh

      - name: Build packages
        run: |
          cd void-packages
          sudo -Eu builder common/travis/build.sh "$BOOTSTRAP" "$ARCH"

      - name: Populate subrepos
        run: |
          cd noid-packages
          sudo -Eu builder common/natalie/populate_subrepos.sh

      - name: Index and sign
        run: |
          cd noid-packages
          sudo -Eu builder common/natalie/index_sign.sh
        env:
          PRIVATE_PEM: ${{ secrets.PRIVATE_PEM }}
          XBPS_PASSPHRASE: ${{ secrets.PEM_PASSPHRASE }}

      - name: Remove outdated packages
        run: |
          cd noid-packages
          sudo -Eu builder common/natalie/remove_outdated.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets
        run: |
          cd noid-packages
          sudo -Eu builder common/natalie/upload_assets.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
